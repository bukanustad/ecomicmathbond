<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Baca Komik — eComicMathBond</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
      :root {
        --md-primary: #1a73e8;
        --md-primary-dark: #0d47a1;
        --md-success: #1e8e3e;
        --md-success-dark: #145c27;
        --md-bg: #202124;
        --md-bg-secondary: #111214;
        --md-text: #e8eaed;
        --md-text-muted: #9aa0a6;
        --md-elevation-2:
          0 2px 6px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.3);
        --md-elevation-4: 0 4px 12px rgba(0, 0, 0, 0.4);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--md-bg);
        font-family: "Roboto", sans-serif;
        color: var(--md-text);
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
      }

      header {
        flex: 0 0 auto;
        padding: 12px 16px;
        background: var(--md-bg-secondary);
        box-shadow: var(--md-elevation-2);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header a.back {
        color: var(--md-text);
        display: flex;
        align-items: center;
        text-decoration: none;
        flex: 0 0 auto;
      }
      header a.back .material-icons {
        font-size: 24px;
      }
      header h1 {
        font-size: 15px;
        font-weight: 500;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      #viewer-wrap {
        flex: 1 1 auto;
        position: relative;
        overflow: auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background: var(--md-bg);
        -webkit-overflow-scrolling: touch;
      }

      #canvas-container {
        margin: 16px auto;
        box-shadow: var(--md-elevation-4);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
        line-height: 0;
        /* Hapus transition opacity agar ganti halaman terasa lebih instan/tidak nge-lag visual */
      }
      #canvas-container.loading {
        display: none;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }

      #loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 5;
        padding: 24px;
        text-align: center;
      }
      #loader.hidden {
        display: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--md-primary);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loader .msg {
        font-size: 14px;
        color: var(--md-text-muted);
        max-width: 340px;
      }
      #loader .err-title {
        font-size: 15px;
        font-weight: 500;
        color: #f28b82;
      }
      #loader .err-detail {
        font-size: 12px;
        color: #8a8d90;
        background: rgba(255, 255, 255, 0.05);
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 340px;
        word-break: break-word;
        font-family: monospace;
      }

      footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px calc(10px + var(--safe-bottom));
        background: var(--md-bg-secondary);
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        outline: none;
        cursor: pointer;
        background: var(--md-primary);
        color: #fff;
        font-family: "Roboto", sans-serif;
        font-weight: 500;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 24px;
        box-shadow: var(--md-elevation-2);
        transition: background 0.2s ease, transform 0.1s ease;
        user-select: none;
      }
      .nav-btn:active {
        transform: scale(0.95);
      }
      .nav-btn:hover {
        background: var(--md-primary-dark);
      }
      .nav-btn:disabled {
        background: #3c4043;
        color: #6a6d70;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }
      
      /* Tombol state ketika di halaman terakhir */
      .nav-btn.selesai {
        background: var(--md-success);
      }
      .nav-btn.selesai:hover {
        background: var(--md-success-dark);
      }

      .nav-btn .material-icons {
        font-size: 20px;
      }

      #page-indicator {
        font-size: 13px;
        font-weight: 500;
        color: var(--md-text-muted);
        background: rgba(255, 255, 255, 0.06);
        padding: 8px 14px;
        border-radius: 20px;
        white-space: nowrap;
        min-width: 64px;
        text-align: center;
      }

      @media (min-width: 600px) {
        header {
          padding: 16px 28px;
        }
        header h1 {
          font-size: 18px;
        }
        footer {
          padding: 14px 28px calc(14px + var(--safe-bottom));
        }
        .nav-btn {
          padding: 11px 22px;
          font-size: 15px;
        }
        #canvas-container {
          margin: 24px auto;
        }
      }
      @media (min-width: 1024px) {
        #canvas-container {
          max-width: 70%;
        }
        .nav-btn {
          padding: 12px 26px;
          font-size: 15px;
        }
      }

      .tap-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        z-index: 3;
      }
      .tap-zone.left {
        left: 0;
      }
      .tap-zone.right {
        right: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <a class="back" href="index.html">
          <span class="material-icons">arrow_back</span>
        </a>
        <h1 id="comic-title">Komik</h1>
      </header>

      <div id="viewer-wrap">
        <div id="loader">
          <div class="spinner"></div>
          <span class="msg">Memuat komik...</span>
        </div>
        <div class="tap-zone left" id="tapLeft"></div>
        <div class="tap-zone right" id="tapRight"></div>
        <div id="canvas-container" class="loading">
          <canvas id="pdf-canvas"></canvas>
        </div>
      </div>

      <footer>
        <button class="nav-btn" id="prevBtn">
          <span class="material-icons">chevron_left</span>
          <span>Sebelumnya</span>
        </button>
        <div id="page-indicator">1 / 1</div>
        <button class="nav-btn" id="nextBtn">
          <span>Lanjut</span>
          <span class="material-icons">chevron_right</span>
        </button>
      </footer>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const PDF_URL = params.get("file") || "komik.pdf";
      const COMIC_TITLE = params.get("title") || "Komik Matematika";

      document.getElementById("comic-title").textContent = COMIC_TITLE;

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const canvas = document.getElementById("pdf-canvas");
      const ctx = canvas.getContext("2d", { alpha: false }); 
      const canvasContainer = document.getElementById("canvas-container");
      const loader = document.getElementById("loader");
      const viewerWrap = document.getElementById("viewer-wrap");
      const pageIndicator = document.getElementById("page-indicator");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let pdfDoc = null;
      let currentPage = 1;
      let totalPages = 0;
      let renderingInProgress = false;
      let pendingPage = null;
      let isFirstLoad = true; // Indikator tambahan untuk loading awal saja

      function getFitScale(viewport) {
        const containerWidth = viewerWrap.clientWidth * (window.innerWidth >= 1024 ? 0.7 : 0.94);
        const containerHeight = viewerWrap.clientHeight * 0.94;
        const scaleW = containerWidth / viewport.width;
        const scaleH = containerHeight / viewport.height;
        return Math.min(scaleW, scaleH, 2.0); 
      }

      function renderPage(num) {
        if (renderingInProgress) {
          pendingPage = num;
          return;
        }
        renderingInProgress = true;

        // Hanya tampilkan loading spinner di halaman pertama
        if (isFirstLoad) {
          canvasContainer.classList.add("loading");
          loader.classList.remove("hidden");
        }

        pdfDoc
          .getPage(num)
          .then((page) => {
            const baseViewport = page.getViewport({ scale: 1 });
            const scale = getFitScale(baseViewport);
            const viewport = page.getViewport({ scale });

            // OPTIMASI: Turunkan lagi limit ratio menjadi 1.5 agar membalik halaman sangat ringan
            const outputScale = Math.min(window.devicePixelRatio || 1, 1.5);

            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = Math.floor(viewport.width) + "px";
            canvas.style.height = Math.floor(viewport.height) + "px";

            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

            return page.render({ canvasContext: ctx, viewport, transform }).promise;
          })
          .then(() => {
            renderingInProgress = false;
            
            // Hapus status loading secara permanen setelah halaman pertama sukses
            isFirstLoad = false;
            canvasContainer.classList.remove("loading");
            loader.classList.add("hidden");
            
            updateControls();
            preloadNextPage(num + 1);

            if (pendingPage !== null) {
              const next = pendingPage;
              pendingPage = null;
              renderPage(next);
            }
          })
          .catch((err) => {
            renderingInProgress = false;
            console.error("Gagal merender halaman:", err);
            showError("Gagal menampilkan halaman " + num + ".", err.message);
          });
      }

      function preloadNextPage(nextNum) {
        if (nextNum <= totalPages && pdfDoc) {
          pdfDoc.getPage(nextNum).catch(() => {});
        }
      }

      function updateControls() {
        pageIndicator.textContent = currentPage + " / " + totalPages;
        prevBtn.disabled = currentPage <= 1;

        // Logika Mengubah Tombol "Lanjut" menjadi "Selesai" di halaman terakhir
        const nextBtnText = nextBtn.querySelector("span:first-of-type");
        const nextBtnIcon = nextBtn.querySelector("span.material-icons");

        if (currentPage >= totalPages) {
          nextBtnText.textContent = "Selesai";
          nextBtnIcon.textContent = "home"; // Mengganti ikon panah dengan ikon home
          nextBtn.classList.add("selesai");
        } else {
          nextBtnText.textContent = "Lanjut";
          nextBtnIcon.textContent = "chevron_right";
          nextBtn.classList.remove("selesai");
        }
      }

      function goToPage(num) {
        if (num < 1 || num > totalPages) return;
        currentPage = num;
        viewerWrap.scrollTop = 0;
        renderPage(currentPage);
      }

      function actionNextOrFinish() {
        if (currentPage >= totalPages) {
          // Redirect ke halaman index/home jika sudah halaman terakhir
          window.location.href = "./";
        } else {
          goToPage(currentPage + 1);
        }
      }

      function showError(title, detail) {
        loader.classList.remove("hidden");
        loader.innerHTML = `
          <span class="material-icons" style="font-size:38px;color:#f28b82;">error_outline</span>
          <span class="err-title">${title}</span>
          <span class="msg">Periksa: nama file PDF sudah tepat dan halaman dibuka lewat http/https.</span>
          ${detail ? `<span class="err-detail">${detail}</span>` : ""}
        `;
      }

      // === Event Listeners ===
      prevBtn.addEventListener("click", () => goToPage(currentPage - 1));
      document.getElementById("tapLeft").addEventListener("click", () => goToPage(currentPage - 1));

      // Gunakan fungsi actionNextOrFinish untuk Next
      nextBtn.addEventListener("click", actionNextOrFinish);
      document.getElementById("tapRight").addEventListener("click", actionNextOrFinish);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") actionNextOrFinish();
        if (e.key === "ArrowLeft") goToPage(currentPage - 1);
      });

      let touchStartX = 0;
      viewerWrap.addEventListener("touchstart", (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true }
      );
      viewerWrap.addEventListener("touchend", (e) => {
          const diff = e.changedTouches[0].screenX - touchStartX;
          if (Math.abs(diff) > 50) {
            diff < 0 ? actionNextOrFinish() : goToPage(currentPage - 1);
          }
        }, { passive: true }
      );

      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          if (pdfDoc) renderPage(currentPage);
        }, 200);
      });

      // === Anti-Screenshot & Proteksi Dasar ===
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey) {
          const key = e.key.toLowerCase();
          if (key === "p" || key === "s" || key === "c" || key === "u") {
            e.preventDefault();
            alert("Tindakan ini tidak diizinkan.");
          }
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.key === "PrintScreen") {
          navigator.clipboard.writeText("Screenshot dilarang.").catch(() => {});
          alert("Anda mencoba melakukan screenshot! Tindakan ini dilarang.");
        }
      });
      window.addEventListener("blur", () => {
        document.body.style.filter = "blur(10px)";
      });
      window.addEventListener("focus", () => {
        document.body.style.filter = "none";
      });

      // === Load PDF Document ===
      const urlWithCacheBust = PDF_URL + (PDF_URL.includes("?") ? "&" : "?") + "v=" + Date.now();
      pdfjsLib
        .getDocument({ url: urlWithCacheBust })
        .promise.then((doc) => {
          pdfDoc = doc;
          totalPages = doc.numPages;
          renderPage(currentPage);
        })
        .catch((err) => {
          console.error(err);
          showError('Gagal memuat PDF "' + PDF_URL + '".', err.message || String(err));
        });
    </script>
  </body>
</html>
