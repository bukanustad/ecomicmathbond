<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eComicMathBond — Baca Komik Matematika</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --md-primary:#1a73e8;
    --md-primary-dark:#0d47a1;
    --md-accent:#fbbc04;
    --md-bg:#f1f3f4;
    --md-surface:#ffffff;
    --md-text:#202124;
    --md-text-muted:#5f6368;
    --md-elevation-1: 0 1px 3px rgba(60,64,67,.25), 0 1px 2px rgba(60,64,67,.15);
    --md-elevation-3: 0 4px 16px rgba(60,64,67,.28), 0 1px 4px rgba(60,64,67,.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--md-bg);font-family:'Roboto',sans-serif;color:var(--md-text);}

  header.top{
    background:linear-gradient(120deg,var(--md-primary) 0%,var(--md-primary-dark) 100%);
    color:#fff;
    padding:36px 20px 60px;
    text-align:center;
    position:relative;
  }
  header.top .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-weight:900;
    font-size:26px;
    letter-spacing:.3px;
  }
  header.top .brand .material-icons{font-size:30px;color:var(--md-accent);}
  header.top p{
    margin:10px 0 0;
    font-size:14px;
    font-weight:400;
    color:rgba(255,255,255,.9);
  }

  main{
    max-width:1100px;
    margin:-38px auto 40px;
    padding:0 20px;
  }

  .section-title{
    font-size:15px;
    font-weight:500;
    color:var(--md-text-muted);
    margin:0 4px 14px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
  }

  .card{
    background:var(--md-surface);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--md-elevation-1);
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--md-elevation-3);
  }
  .card:active{transform:translateY(-1px);}

  .cover{
    position:relative;
    aspect-ratio:3/4;
    background:linear-gradient(135deg,#e8f0fe,#d2e3fc);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .cover canvas{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .cover .fallback-icon{
    font-size:56px;
    color:var(--md-primary);
    opacity:.55;
  }
  .cover .badge{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--md-accent);
    color:#202124;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:12px;
    letter-spacing:.3px;
  }

  .card-body{
    padding:14px 14px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  .card-body h3{
    margin:0;
    font-size:15px;
    font-weight:500;
    line-height:1.3;
  }
  .card-body span{
    font-size:12.5px;
    color:var(--md-text-muted);
  }
  .card-body .read-cta{
    margin-top:auto;
    padding-top:10px;
    display:flex;
    align-items:center;
    gap:4px;
    font-size:13px;
    font-weight:500;
    color:var(--md-primary);
  }
  .card-body .read-cta .material-icons{font-size:16px;}

  .empty-note{
    background:var(--md-surface);
    border-radius:14px;
    padding:28px;
    text-align:center;
    color:var(--md-text-muted);
    box-shadow:var(--md-elevation-1);
    font-size:14px;
  }

  footer.bottom{
    text-align:center;
    padding:24px;
    font-size:12.5px;
    color:var(--md-text-muted);
  }

  @media (min-width:1024px){
    main{margin-top:-46px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="material-icons">auto_stories</span>
    <span>eComicMathBond</span>
  </div>
  <p>Kumpulan komik matematika yang seru dan gampang dipahami</p>
</header>

<main>
  <div class="section-title">Daftar Komik</div>
  <div class="grid" id="comicGrid"></div>
</main>

<footer class="bottom">eComicMathBond — dibuat untuk belajar matematika lebih menyenangkan</footer>

<script>
/* ============ DAFTAR KOMIK ============ *
 * Tambahkan komik baru dengan menambah 1 baris di array ini.
 * file  : nama file PDF (letakkan di folder yang sama dengan index.html / reader.html)
 * title : judul yang ditampilkan
 * tag   : label kecil di pojok kiri atas kartu (opsional)
 * ====================================== */
const COMICS = [
  { file: 'komik.pdf', title: 'Komik Matematika', tag: 'Baru', desc: 'Belajar konsep matematika lewat cerita bergambar' }
];

const grid = document.getElementById('comicGrid');

if (COMICS.length === 0) {
  grid.innerHTML = '<div class="empty-note">Belum ada komik yang tersedia. Nantikan update berikutnya!</div>';
} else {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  COMICS.forEach((comic, idx) => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = 'reader.html?file=' + encodeURIComponent(comic.file) + '&title=' + encodeURIComponent(comic.title);

    card.innerHTML = `
      <div class="cover" id="cover-${idx}">
        <span class="material-icons fallback-icon">menu_book</span>
        ${comic.tag ? `<span class="badge">${comic.tag}</span>` : ''}
      </div>
      <div class="card-body">
        <h3>${comic.title}</h3>
        <span>${comic.desc || ''}</span>
        <div class="read-cta">
          <span>Baca sekarang</span>
          <span class="material-icons">arrow_forward</span>
        </div>
      </div>
    `;
    grid.appendChild(card);

    // Coba render halaman pertama PDF sebagai cover (gagal? biarkan fallback icon tampil)
    pdfjsLib.getDocument(comic.file).promise.then(pdf => pdf.getPage(1)).then(page => {
      const viewport = page.getViewport({ scale: 1 });
      const targetWidth = 320;
      const scale = targetWidth / viewport.width;
      const scaledViewport = page.getViewport({ scale });

      const canvas = document.createElement('canvas');
      canvas.width = scaledViewport.width;
      canvas.height = scaledViewport.height;
      const ctx = canvas.getContext('2d');

      return page.render({ canvasContext: ctx, viewport: scaledViewport }).promise.then(() => {
        const coverEl = document.getElementById('cover-' + idx);
        const icon = coverEl.querySelector('.fallback-icon');
        if (icon) icon.remove();
        coverEl.prepend(canvas);
      });
    }).catch(err => {
      // Diamkan saja — kartu tetap tampil dengan ikon fallback
      console.warn('Cover PDF "' + comic.file + '" tidak bisa dimuat:', err.message);
    });
  });
}
</script>

</body>
</html>
